<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبدیل آگهی دیوار</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f5f7;color:#161616}.wrap{max-width:760px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #00000012;margin-bottom:16px}h1{margin:0 0 8px;font-size:25px}.sub{color:#666;margin-bottom:20px}label{display:block;font-weight:700;margin:10px 0 8px}input,textarea{width:100%;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:15px;outline:none}input:focus,textarea:focus{border-color:#111}button{border:0;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#111;color:#fff;margin-top:12px}.copy{background:#198754}.muted{font-size:12px;color:#777;margin-top:10px}.status{margin-top:12px;color:#b42318}.ok{color:#087443}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}.contacts{background:#fafafa;padding:12px;border-radius:14px;margin-top:12px}.contacts b{display:block;margin-bottom:5px}textarea{min-height:390px;line-height:1.9}</style></head><body><main class="wrap"><section class="card"><h1>🏠 تبدیل آگهی دیوار</h1><div class="sub">لینک آگهی را وارد کن؛ متن آماده انتشار را تحویل بگیر.</div><label>لینک آگهی دیوار</label><input id="url" placeholder="https://divar.ir/v/..." inputmode="url"><button id="convert">تبدیل به آگهی</button><div id="status" class="status"></div><div class="contacts"><b>شماره‌های تماس خروجی</b>📞 09169656746<br>📞 09386204943</div></section><section class="card" id="result" style="display:none"><label>خروجی آماده تلگرام</label><textarea id="output"></textarea><div class="row"><button class="copy" id="copy">📋 کپی متن</button><button id="clear">پاک کردن</button></div></section></main><script>
const $=id=>document.getElementById(id);$('convert').onclick=async()=>{const url=$('url').value.trim();$('status').textContent='در حال دریافت آگهی...';$('status').className='status';try{const r=await fetch('/api/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const j=await r.json();if(!r.ok)throw new Error(j.error||'خطا');$('output').value=j.output;$('result').style.display='block';$('status').textContent='✅ آماده شد';$('status').className='status ok'}catch(e){$('status').textContent='❌ '+e.message}};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);$('copy').textContent='✅ کپی شد';setTimeout(()=>$('copy').textContent='📋 کپی متن',1500)};$('clear').onclick=()=>{$('output').value='';$('result').style.display='none'};
</script></body></html>
